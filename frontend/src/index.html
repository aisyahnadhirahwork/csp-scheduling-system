<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      Intelligent Scheduling
    </title>

    <!-- flyon ui datepicker css -->


  </head>
  <body
    x-data="{ page: 'ecommerce', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >

    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start (doctors only) ===== -->
      <div class="sidebar-wrapper doctor-view">
        <include src="./partials/sidebar.html"></include>
      </div>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto"
      >
        <!-- Small Device Overlay Start (doctors only) -->
        <div class="doctor-view">
          <include src="./partials/overlay.html" />
        </div>
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
            <div class="grid grid-cols-12 gap-4 md:gap-6">

              <div class="col-span-12 doctor-view">
                <include src="./partials/chart/chart-03.html" />
              </div>

              <!-- PATIENT DASHBOARD VIEW -->

              <div class="col-span-12 patient-view">
                <include src="./partials/a-patient-view/table-patient.html" />
              </div>

              <div class="col-span-12 xl:col-span-6 patient-view">
                <!-- ====== Doctor Preferences Input -->
                <include src="./partials/a-patient-view/patient-preferences.html" />
                <!-- ====== Chart Three End -->
              </div>

              <div class="col-span-12 xl:col-span-6 patient-view">
                <!-- ====== Table One Start -->
                <include src="./partials/table/table-01.html" />
                <!-- ====== Table One End -->
              </div>

               <!-- <div class="col-span-12 xl:col-span-5">
                <include src="./partials/map-01.html" />
              </div> -->

            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
document.addEventListener("DOMContentLoaded", () => {
  const role = localStorage.getItem("user_type");
  if(role === "doctor") {
    document.querySelectorAll(".patient-view").forEach(el => el.classList.add("hidden"));
  } else if(role === "patient") {
    document.querySelectorAll(".doctor-view").forEach(el => el.classList.add("hidden"));
  }
});
</script>
