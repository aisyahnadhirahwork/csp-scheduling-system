<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | TailAdmin</title>
  <style>
    :root {
      --bg-a: #e7f1ff;
      --bg-b: #dff7ef;
      --bg-c: #f8fbff;
      --card-border: rgba(255, 255, 255, 0.45);
      --card-shadow: 0 20px 50px rgba(19, 42, 79, 0.16);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --particle: rgba(37, 99, 235, 0.28);
    }

    * { transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease; }
    * { box-sizing: border-box; }
    input, select, textarea { transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease; }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.2), transparent 35%),
        radial-gradient(circle at 82% 18%, rgba(16, 185, 129, 0.16), transparent 35%),
        linear-gradient(140deg, var(--bg-a), var(--bg-b) 52%, var(--bg-c));
      overflow: hidden;
      position: relative;
    }

    .particle-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.9), var(--particle));
      opacity: 0.35;
      animation: drift var(--dur) linear infinite;
      animation-delay: var(--delay);
      left: var(--x);
      top: var(--y);
    }

    @keyframes drift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      25% { transform: translate3d(16px, -26px, 0) scale(1.03); }
      50% { transform: translate3d(-20px, -54px, 0) scale(0.96); }
      75% { transform: translate3d(13px, -30px, 0) scale(1.04); }
      100% { transform: translate3d(0, 0, 0) scale(1); }
    }

    .auth-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 980px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 28px;
    }

    input:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); outline: none; }
    input::placeholder { color: #9ca3af; }
    .input-icon { position: relative; }
    .input-icon svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #9ca3af; pointer-events: none; }
    .input-icon input { padding-left: 40px; }
    .password-strength { height: 4px; background-color: #e5e7eb; border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .strength-bar { height: 100%; width: 0%; transition: width 0.3s ease, background-color 0.3s ease; }
    .strength-weak { width: 33%; background-color: #ef4444; }
    .strength-fair { width: 66%; background-color: #eab308; }
    .strength-good { width: 100%; background-color: #84cc16; }
    .form-section { padding: 20px; border-radius: 12px; background: linear-gradient(135deg, #f3f4f6 0%, #ffffff 100%); border: 1px solid #e5e7eb; margin-bottom: 20px; }
    .dark .form-section { background: linear-gradient(135deg, rgba(31, 41, 55, 0.5) 0%, rgba(17, 24, 39, 0.5) 100%); border-color: rgba(75, 85, 99, 0.3); }
    button[type="submit"] { font-weight: 600; letter-spacing: 0.5px; position: relative; overflow: hidden; }
    button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3); }
    button[type="submit"]:active { transform: translateY(0); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .social-buttons button { font-weight: 500; border: 1px solid #e5e7eb; transition: all 0.3s ease; }
    .social-buttons button:hover { border-color: #3b82f6; background-color: #f0f9ff; color: #3b82f6; }
    .dark .social-buttons button:hover { background-color: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
    .divider { position: relative; text-align: center; margin: 24px 0; }
    .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background-color: #e5e7eb; }
    .dark .divider::before { background-color: #374151; }
    .divider span { position: relative; display: inline-block; padding: 0 16px; background: white; color: #6b7280; font-size: 14px; font-weight: 500; }
    .dark .divider span { background: #111827; }
    .checkbox-custom { width: 20px; height: 20px; cursor: pointer; accent-color: #3b82f6; }
    .checkbox-label { cursor: pointer; user-select: none; }
    .checkbox-label a { color: #3b82f6; font-weight: 500; text-decoration: none; }
    .checkbox-label a:hover { text-decoration: underline; }
    .sign-in-link { text-align: center; padding-top: 20px; border-top: 1px solid #e5e7eb; margin-top: 20px; }
    .dark .sign-in-link { border-top-color: #374151; }
    .fade-in { animation: fadeIn 0.5s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .field-group { animation: fadeIn 0.5s ease-in; }

    @media (max-width: 1024px) {
      .auth-card {
        max-width: 720px;
        padding: 22px;
      }
    }

    @media (max-width: 520px) {
      .auth-shell {
        padding: 14px;
      }
      .auth-card {
        border-radius: 16px;
        padding: 18px;
      }
    }
  </style>
</head>

<body
  x-data="{
    darkMode: JSON.parse(localStorage.getItem('darkMode')) || false,
    userType: '',
    showDoctorFields: false
  }"
  x-init="$watch('darkMode', v => localStorage.setItem('darkMode', JSON.stringify(v)))"
  :class="{ 'dark': darkMode }"
  class=""
>

<div id="particleLayer" class="particle-layer" aria-hidden="true"></div>

<div class="auth-shell">
  <div class="auth-card flex flex-col lg:flex-row gap-12">

  <!-- FORM -->
    <div class="flex flex-col flex-1 max-w-md mx-auto">

      <div class="fade-in">
        <h1 class="mb-2 text-3xl font-bold text-gray-900 dark:text-white">
          Create Account
        </h1>
        <p class="mb-8 text-sm text-gray-600 dark:text-gray-400">
          Join our healthcare scheduling platform
        </p>
      </div>

      <!-- FORM -->
      <form id="signupForm" class="space-y-5 fade-in">

        <!-- NAME -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 field-group">
          <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">First Name</label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input
                name="first_name"
                id="first_name"
                required
                placeholder="John"
                class="w-full h-11 px-4 border border-gray-300 dark:border-gray-700 rounded-lg dark:bg-gray-800 dark:text-white"
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Last Name</label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input
                name="last_name"
                id="last_name"
                required
                placeholder="Doe"
                class="w-full h-11 px-4 border border-gray-300 dark:border-gray-700 rounded-lg dark:bg-gray-800 dark:text-white"
              />
            </div>
          </div>
        </div>

        <!-- USER TYPE -->
        <div class="field-group">
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">User Type</label>
          <select
            name="user_type"
            id="user_type"
            required
            x-model="userType"
            @change="showDoctorFields = userType === 'doctor'"
            class="w-full h-11 px-4 border border-gray-300 dark:border-gray-700 rounded-lg dark:bg-gray-800 dark:text-white font-medium"
          >
            <option value="">📍 Select your role</option>
            <option value="patient">👤 Patient</option>
            <option value="doctor">👨‍⚕️ Doctor</option>
          </select>
        </div>

        <!-- DOCTOR ONLY -->
        <div x-show="showDoctorFields" x-transition class="form-section space-y-4 field-group">
          <p class="text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wide">Professional Information</p>

          <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Gender</label>
            <select
              name="gender"
              id="gender"
              class="w-full h-11 px-4 border border-gray-300 dark:border-gray-700 rounded-lg dark:bg-gray-800 dark:text-white font-medium"
            >
              <option value="">👥 Select gender</option>
              <option value="male">♂️ Male</option>
              <option value="female">♀️ Female</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Specialisation</label>
            <select
              name="specialisation"
              id="specialisation"
              class="w-full h-11 px-4 border border-gray-300 dark:border-gray-700 rounded-lg dark:bg-gray-800 dark:text-white font-medium"
            >
              <option value="">🏥 Select specialisation</option>
              <option value="general">👨‍⚕️ General Doctor</option>
              <option value="cardiology">❤️ Cardiology</option>
              <option value="pediatrics">👶 Pediatrics</option>
              <option value="neurology">🧠 Neurology</option>
            </select>
          </div>

        </div>

        <!-- EMAIL -->
        <div class="field-group">
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input
              type="email"
              name="email"
              id="email"
              required
              placeholder="you@example.com"
              class="w-full h-11 px-4 border border-gray-300 dark:border-gray-700 rounded-lg dark:bg-gray-800 dark:text-white"
            />
          </div>
        </div>

        <!-- PASSWORD -->
        <div x-data="{ show: false, strength: 0 }" class="field-group">
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Password</label>
          <div class="relative input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              :type="show ? 'text' : 'password'"
              name="password"
              id="password"
              required
              placeholder="Minimum 8 characters"
              @input="strength = $el.value.length > 0 ? ((/[a-z]/.test($el.value) + /[A-Z]/.test($el.value) + /[0-9]/.test($el.value) + /[^a-zA-Z0-9]/.test($el.value)) * 25) : 0"
              class="w-full h-11 px-4 pr-10 border border-gray-300 dark:border-gray-700 rounded-lg dark:bg-gray-800 dark:text-white pr-12"
            />
            <span
              class="absolute right-3 top-3 cursor-pointer text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200"
              @click="show = !show"
            >
              <span x-show="!show">👁️</span>
              <span x-show="show">👁️‍🗨️</span>
            </span>
          </div>
          <div class="password-strength mt-2">
            <div class="strength-bar" :class="strength <= 33 ? 'strength-weak' : strength <= 66 ? 'strength-fair' : 'strength-good'" :style="`width: ${strength}%`"></div>
          </div>
          <p class="text-xs mt-2 text-gray-600 dark:text-gray-400">Use uppercase, lowercase, numbers and symbols for a strong password</p>
        </div>

        <!-- TERMS -->
        <label class="flex items-start gap-3 text-sm checkbox-label field-group">
          <input type="checkbox" required class="checkbox-custom mt-1" />
          <span class="text-gray-700 dark:text-gray-300">
            I agree to the <a href="#" class="text-blue-600 dark:text-blue-400">Terms of Service</a> and <a href="#" class="text-blue-600 dark:text-blue-400">Privacy Policy</a>
          </span>
        </label>

        <!-- SUBMIT -->
        <button
          type="submit"
          class="w-full py-3 text-white rounded-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:opacity-50 disabled:cursor-not-allowed font-semibold shadow-md hover:shadow-lg field-group"
          id="submitBtn"
        >
          <span id="submitText">Create Account</span>
          <span id="submitSpinner" style="display: none;">⏳ Creating...</span>
        </button>

      </form>

      <div class="sign-in-link">
        <p class="text-sm text-gray-600 dark:text-gray-400">
          Already have an account?
          <a href="/signin.html" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">Sign In</a>
        </p>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const layer = document.getElementById("particleLayer")
  if (layer) {
    const count = 28
    for (let i = 0; i < count; i += 1) {
      const p = document.createElement("span")
      p.className = "particle"
      const size = 3 + Math.random() * 7
      const duration = 18 + Math.random() * 24
      const delay = -(Math.random() * duration)
      p.style.setProperty("--size", `${size}px`)
      p.style.setProperty("--dur", `${duration}s`)
      p.style.setProperty("--delay", `${delay}s`)
      p.style.setProperty("--x", `${Math.random() * 100}%`)
      p.style.setProperty("--y", `${Math.random() * 100}%`)
      layer.appendChild(p)
    }
  }
})

document.getElementById("signupForm").addEventListener("submit", async e => {
  e.preventDefault()
  const f = e.target
  const btn = document.getElementById("submitBtn")
  const submitText = document.getElementById("submitText")
  const submitSpinner = document.getElementById("submitSpinner")

  // Show loading state
  btn.disabled = true
  submitText.style.display = "none"
  submitSpinner.style.display = "inline"

  const payload = {
    first_name: f.first_name.value,
    last_name: f.last_name.value,
    email: f.email.value,
    password: f.password.value,
    user_type: f.user_type.value,
    gender: f.gender?.value || null,
    specialisation: f.specialisation?.value || null
  }

  try {
    const res = await fetch("/api/register/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })

    const data = await res.json()

    if (res.ok) {
      Swal.fire("Success 🎉", "Account created successfully!", "success")
        .then(() => location.href = "/signin.html")
    } else {
      Swal.fire("Error", data.error || "Registration failed", "error")
      btn.disabled = false
      submitText.style.display = "inline"
      submitSpinner.style.display = "none"
    }
  } catch {
    Swal.fire("Error", "Server not reachable", "error")
    btn.disabled = false
    submitText.style.display = "inline"
    submitSpinner.style.display = "none"
  }
})
</script>

</body>
</html>
