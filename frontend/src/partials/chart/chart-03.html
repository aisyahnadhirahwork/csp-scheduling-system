<div
  x-data="{
    selected: 'Upcoming',
    sortOrder: 'newest',
    doctorName: (localStorage.getItem('first_name') || '') + ' ' + (localStorage.getItem('last_name') || ''),
    doctorSpecialty: localStorage.getItem('specialty') || '',
    patients: [],
    async loadPatients() {
      const res = await fetch('/api/appointments');
      this.patients = await res.json();
    }
  }"
  x-cloak
  class="rounded-2xl border border-gray-200 bg-white px-5 pb-5 pt-5 shadow-sm dark:border-gray-800 dark:bg-white/[0.03] sm:px-6 sm:pt-6"
>
  <div class="mb-6 flex flex-col gap-5 border-b border-gray-100 pb-5 dark:border-gray-800 sm:flex-row sm:items-center sm:justify-between">
    <div class="w-full">
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
        Appointments
      </h3>
      <p class="text-theme-sm mt-1 text-gray-500 dark:text-gray-400">
        Dr <span x-text="doctorName"></span>
        <span x-show="doctorSpecialty" x-text="'(' + doctorSpecialty + ')'"></span>
      </p>
    </div>

    <div class="flex w-full items-start gap-3 sm:justify-end">
      <div class="inline-flex w-fit items-center gap-1 rounded-xl border border-gray-200 bg-gray-50 p-1 dark:border-gray-800 dark:bg-gray-900">
        <button
          @click="selected = 'Upcoming'"
          :class="selected === 'Upcoming'
            ? 'bg-white text-gray-900 shadow-theme-xs dark:bg-gray-800 dark:text-white'
            : 'text-gray-500 dark:text-gray-400'"
          class="text-theme-sm rounded-lg px-3 py-2 font-medium transition hover:text-gray-900 dark:hover:text-white"
        >
          Upcoming
        </button>

        <button
          @click="selected = 'Completed'"
          :class="selected === 'Completed'
            ? 'bg-white text-gray-900 shadow-theme-xs dark:bg-gray-800 dark:text-white'
            : 'text-gray-500 dark:text-gray-400'"
          class="text-theme-sm rounded-lg px-3 py-2 font-medium transition hover:text-gray-900 dark:hover:text-white"
        >
          Completed
        </button>

        <button
          @click="selected = 'Cancelled'"
          :class="selected === 'Cancelled'
            ? 'bg-white text-gray-900 shadow-theme-xs dark:bg-gray-800 dark:text-white'
            : 'text-gray-500 dark:text-gray-400'"
          class="text-theme-sm rounded-lg px-3 py-2 font-medium transition hover:text-gray-900 dark:hover:text-white"
        >
          Cancelled
        </button>
      </div>

      <!-- Sort dropdown -->
      <div class="relative">
        <select
          x-model="sortOrder"
          class="appearance-none rounded-lg border border-gray-200 bg-white px-3 py-2 pr-8 text-sm font-medium text-gray-700 shadow-sm transition hover:border-gray-300 focus:border-brand-300 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:border-gray-600"
        >
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
        </select>
        <svg class="pointer-events-none absolute right-2 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
      </div>
    </div>
  </div>

  <div
    x-data="{
      appointments: [],
      confirmOpen: false,
      confirmId: null,
      confirmStatus: '',
      confirmPatient: '',

      async loadAppointments(){
        const res = await fetch('/api/appointments/',{
          credentials:'include'
        })
        this.appointments = await res.json()
      },

      showConfirm(id, status, patientName){
        this.confirmId = id
        this.confirmStatus = status
        this.confirmPatient = patientName
        this.confirmOpen = true
      },

      async confirmAction(){
        this.confirmOpen = false
        try {
          const res = await fetch(`/api/appointments/${this.confirmId}/status/`,{
            method:'PATCH',
            headers:{'Content-Type':'application/json'},
            credentials:'include',
            body: JSON.stringify({status: this.confirmStatus})
          })
          const data = await res.json()
          if(!res.ok){
            alert(data.error || 'Failed to update status')
            return
          }
        } catch(err){
          alert('Server error: ' + err.message)
          return
        }
        this.loadAppointments()
      },

      formatTime(start,end){
        const s = new Date(start)
        const e = new Date(end)

        return s.toLocaleString([], {
          dateStyle:'medium',
          timeStyle:'short'
        }) + ' - ' +
        e.toLocaleTimeString([], {
          timeStyle:'short'
        })
      }
    }"
    x-init="loadAppointments()"
  >
    <div class="rounded-xl border border-gray-200 bg-gradient-to-r from-brand-50 to-white px-4 py-3 text-sm text-gray-700 dark:border-gray-800 dark:from-white/[0.04] dark:to-white/[0.01] dark:text-gray-300">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p class="text-sm font-semibold text-gray-800 dark:text-white/90">Appointments Overview</p>
          <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Manage current appointment requests and status updates from one place.</p>
        </div>
        <div class="inline-flex rounded-full bg-white px-3 py-1 text-xs font-medium text-gray-700 shadow-sm dark:bg-gray-800 dark:text-gray-300">
          System View
        </div>
      </div>
    </div>

    <div class="pt-4 text-sm text-gray-700 dark:text-gray-300">
      <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-white/[0.03]">
        <div class="max-h-[500px] overflow-auto">
          <table class="min-w-full">
            <thead class="sticky top-0 z-10">
              <tr class="border-b border-gray-100 bg-gray-50/80 dark:border-gray-800 dark:bg-white/[0.02]">
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 sm:px-6">Patient</th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 sm:px-6">Reason</th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 sm:px-6">Time</th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 sm:px-6">Status</th>
                <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 sm:px-6">Actions</th>
              </tr>
            </thead>

            <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
              <template x-for="appt in appointments.filter(a => a.status === selected).sort((a, b) => sortOrder === 'newest' ? new Date(b.slot_start) - new Date(a.slot_start) : new Date(a.slot_start) - new Date(b.slot_start))" :key="appt.appointment_id">
                <tr class="transition hover:bg-gray-50/70 dark:hover:bg-white/[0.02]">
                  <td class="px-5 py-4 sm:px-6">
                    <div class="flex items-center gap-3">
                      <div class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-100 text-sm font-semibold text-brand-700 dark:bg-brand-500/20 dark:text-brand-300">
                        <span x-text="(appt.patient_name || '?').charAt(0)"></span>
                      </div>
                      <span class="font-medium text-gray-800 dark:text-white/90" x-text="appt.patient_name"></span>
                    </div>
                  </td>

                  <td class="px-5 py-4 sm:px-6">
                    <span class="inline-flex items-center justify-center rounded-full bg-brand-500 px-2.5 py-1 text-xs font-medium text-white">
                      General Consultation
                    </span>
                  </td>

                  <td class="px-5 py-4 sm:px-6">
                    <span class="text-gray-700 dark:text-gray-300" x-text="formatTime(appt.slot_start, appt.slot_end)"></span>
                  </td>

                  <td class="px-5 py-4 sm:px-6">
                    <span
                      x-show="appt.status==='Upcoming'"
                      class="inline-flex rounded-full bg-warning-500 px-3 py-1 text-xs text-white">
                      Upcoming
                    </span>

                    <span
                      x-show="appt.status==='Completed'"
                      class="inline-flex rounded-full bg-success-500 px-3 py-1 text-white text-xs">
                      Completed
                    </span>

                    <span
                      x-show="appt.status==='Cancelled'"
                      class="inline-flex rounded-full bg-error-500 px-3 py-1 text-white text-xs">
                      Cancelled
                    </span>
                  </td>

                  <td class="px-5 py-4 sm:px-6">
                    <div class="flex flex-wrap gap-2">
                      <template x-if="appt.status === 'Upcoming'">
                        <div class="flex flex-wrap gap-2">
                          <button
                            @click="showConfirm(appt.appointment_id, 'Completed', appt.patient_name)"
                            class="rounded-lg bg-green-500 px-3 py-2 text-xs font-medium text-white transition hover:bg-green-600">
                            Complete
                          </button>
                          <button
                            @click="showConfirm(appt.appointment_id, 'Cancelled', appt.patient_name)"
                            class="rounded-lg bg-red-500 px-3 py-2 text-xs font-medium text-white transition hover:bg-red-600">
                            Cancel
                          </button>
                        </div>
                      </template>
                      <template x-if="appt.status !== 'Upcoming'">
                        <span class="text-xs text-gray-400 dark:text-gray-500">No actions</span>
                      </template>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Confirmation Popup -->
    <div
      x-show="confirmOpen"
      x-transition.opacity.duration.200ms
      class="fixed inset-0 z-[99999] flex items-center justify-center bg-black/40 backdrop-blur-sm"
      @click.self="confirmOpen = false"
    >
      <div
        x-show="confirmOpen"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95"
        class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl dark:bg-gray-900"
      >
        <!-- Icon -->
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full"
          :class="confirmStatus === 'Completed' ? 'bg-green-100 dark:bg-green-500/20' : 'bg-red-100 dark:bg-red-500/20'">
          <svg x-show="confirmStatus === 'Completed'" class="h-6 w-6 text-green-600 dark:text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          <svg x-show="confirmStatus === 'Cancelled'" class="h-6 w-6 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </div>

        <h3 class="text-center text-base font-semibold text-gray-900 dark:text-white">
          <span x-text="confirmStatus === 'Completed' ? 'Complete Appointment?' : 'Cancel Appointment?'"></span>
        </h3>
        <p class="mt-2 text-center text-sm text-gray-500 dark:text-gray-400">
          Are you sure you want to
          <span x-text="confirmStatus === 'Completed' ? 'mark as completed' : 'cancel'"
            :class="confirmStatus === 'Completed' ? 'font-medium text-green-600 dark:text-green-400' : 'font-medium text-red-600 dark:text-red-400'"></span>
          the appointment with
          <span class="font-medium text-gray-800 dark:text-white" x-text="confirmPatient"></span>?
        </p>

        <div class="mt-5 flex gap-3">
          <button
            @click="confirmOpen = false"
            class="flex-1 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 transition hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700">
            Go Back
          </button>
          <button
            @click="confirmAction()"
            class="flex-1 rounded-lg px-4 py-2.5 text-sm font-medium text-white transition"
            :class="confirmStatus === 'Completed' ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600'">
            <span x-text="confirmStatus === 'Completed' ? 'Yes, Complete' : 'Yes, Cancel'"></span>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
