  <div
    class="flex flex-col gap-2 mb-4 sm:flex-row sm:items-center sm:justify-between"

<template x-if="$store.latestPreference">
<div class="mb-5 w-full rounded-2xl border border-brand-200 bg-gradient-to-r from-brand-50 via-white to-white p-5 shadow-sm dark:border-gray-700 dark:from-brand-500/10 dark:via-gray-900 dark:to-gray-900">

  <div class="flex items-center justify-between mb-4">
    <div>
      <h4 class="text-md font-semibold text-gray-800 dark:text-white">
        Your Latest Preferences
      </h4>
      <p class="text-xs text-gray-500">
        These preferences were used to generate the matches below
      </p>
    </div>

    <span class="rounded-full bg-brand-500 px-3 py-1 text-xs font-medium text-white">
      Active
    </span>
  </div>

  <div class="grid grid-cols-1 gap-3 text-sm sm:grid-cols-2">

    <div class="rounded-lg border border-gray-200 bg-white px-3 py-2 dark:border-gray-800 dark:bg-gray-900/40">
      <span class="text-xs text-gray-400">Specialty</span>
      <span class="mt-0.5 block font-medium text-gray-800 dark:text-white"
        x-text="$store.latestPreference.preferred_specialty || 'General'">
      </span>
    </div>

    <div class="rounded-lg border border-gray-200 bg-white px-3 py-2 dark:border-gray-800 dark:bg-gray-900/40">
      <span class="text-xs text-gray-400">Doctor Gender</span>
      <span class="mt-0.5 block font-medium text-gray-800 dark:text-white"
        x-text="$store.latestPreference.preferred_gender === 'M' ? 'Male' : ($store.latestPreference.preferred_gender === 'F' ? 'Female' : 'Any')">
      </span>
    </div>

    <div class="rounded-lg border border-gray-200 bg-white px-3 py-2 dark:border-gray-800 dark:bg-gray-900/40">
      <span class="text-xs text-gray-400">Preferred Time</span>
      <span class="mt-0.5 block font-medium text-gray-800 dark:text-white"
        x-text="$store.latestPreference.preferred_time_range">
      </span>
    </div>

    <div class="rounded-lg border border-gray-200 bg-white px-3 py-2 dark:border-gray-800 dark:bg-gray-900/40">
      <span class="text-xs text-gray-400">Session Length</span>
      <span class="mt-0.5 block font-medium text-gray-800 dark:text-white"
        x-text="$store.latestPreference.session_length + ' minutes'">
      </span>
    </div>

    <div class="rounded-lg border border-gray-200 bg-white px-3 py-2 dark:border-gray-800 dark:bg-gray-900/40 sm:col-span-2">
      <span class="text-xs text-gray-400">Requested Date</span>
      <span class="mt-0.5 block font-medium text-gray-800 dark:text-white"
        x-text="new Date($store.latestPreference.request_date).toLocaleDateString()">
      </span>
    </div>

  </div>

</div>
</template>
  </div>
  <div class="w-full overflow-x-auto rounded-xl border border-gray-100 dark:border-gray-800">
    <table class="min-w-full">
      <!-- table header start -->
      <thead>
        <tr class="border-y border-gray-100 bg-gray-50/70 dark:border-gray-800 dark:bg-white/[0.02]">
          <th class="px-3 py-3 text-left sm:px-5">
            <div class="flex items-center">
              <p
                class="text-theme-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400"
              >
                Doctor
              </p>
            </div>
          </th>
          <th class="px-3 py-3 text-left sm:px-5">
            <div class="flex items-center">
              <p
                class="text-theme-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400"
              >
                Specialty
              </p>
            </div>
          </th class="py-3">
          <th class="px-3 py-3 text-left sm:px-5">
            <div class="flex items-center">
              <p
                class="text-theme-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400"
              >
                Date &amp; Time
              </p>
            </div>
          </th>
          <th class="px-3 py-3 text-left sm:px-5">
            <div class="flex items-center col-span-2">
              <p
                class="text-theme-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400"
              >
                Status
              </p>
            </div>
          </th>
          <th class="px-3 py-3 text-left sm:px-5">
            <div class="flex items-center col-span-2">
              <p
                class="text-theme-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400"
              >
                Select
              </p>
            </div>
          </th>
        </tr>
      </thead>
      <!-- table header end -->

      <tbody class="divide-y divide-gray-100 dark:divide-gray-800"
              x-data="{
                  async selectDoctor(doc) {
                      try {
                          const res = await fetch('/api/appointments/', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json' },
                              credentials: 'include',
                              body: JSON.stringify({
                                  doctor_id: doc.doctor_id,
                                  slot_start: doc.slot.start,
                                  slot_end: doc.slot.end,
                                  penalty: doc.penalty,
                                  preference_id: Alpine.store('preferenceId') || null,
                              })
                          });
                          const data = await res.json();
                          if (res.ok) {
                              Swal.fire('Scheduled', 'Appointment created', 'success');
                              // optionally refresh matches or clear
                              if (Alpine) Alpine.store('matches', []);
                          } else {
                              Swal.fire('Error', data.error || 'Failed to book', 'error');
                          }
                      } catch (e) {
                          console.error(e);
                          Swal.fire('Error', 'Request failed', 'error');
                      }
                  }
              }"
        >
        <template x-for="(doctor, idx) in ($store.matches || [])" :key="(doctor && doctor.doctor_id ? doctor.doctor_id + '-' + idx : idx)">
        <tr x-show="$store.matches && $store.matches.length > 0" class="transition hover:bg-gray-50/70 dark:hover:bg-white/[0.02]">
          <td class="px-3 py-3 sm:px-5">
            <div class="flex items-center">
              <div class="flex items-center gap-3">
                <div class="h-[50px] w-[50px] overflow-hidden rounded-md">
                  <img src="./images/user/user-02.jpg" alt="User" />
                </div>
                <div>
                  <p class="font-medium text-gray-800 text-theme-sm dark:text-white/90"
                    >Dr
                  </p>
                  <p
                    class="font-medium text-gray-800 text-theme-sm dark:text-white/90"
                    x-text="doctor.name"
                  >
                  </p>
                  <span class="text-gray-500 text-theme-xs dark:text-gray-400"
                    x-text="doctor.gender === 'M' ? 'Male' : 'Female'">
                  </span>
                </div>
              </div>
            </div>
          </td>
          <td class="px-3 py-3 sm:px-5">
            <div class="flex items-center">
              <p class="text-gray-500 text-theme-sm dark:text-gray-400"
                x-text="doctor.specialty">
              </p>
            </div>
          </td>
          <td class="px-3 py-3 sm:px-5">
            <div class="flex flex-col">
              <p class="text-gray-500 text-theme-sm dark:text-gray-400"
                x-text="doctor.slot.start
                         ? (new Date(doctor.slot.start).toLocaleString([], {dateStyle:'short', timeStyle:'short'}) +
                            ' – ' +
                            new Date(doctor.slot.end).toLocaleString([], {dateStyle:'short', timeStyle:'short'}))
                         : 'TBD'">
              </p>
              <!-- <template x-if="doctor.available_slots && doctor.available_slots.length">
                 <ul class="text-xs text-gray-400 mt-1">
                   <template x-for="(s, idx2) in doctor.available_slots" :key="s.start ?? idx2">
                     <li x-text="new Date(s.start).toLocaleString([], {dateStyle:'short', timeStyle:'short'})"></li>
                   </template>
                 </ul>
              </template> -->
            </div>
          </td>
          <td class="px-3 py-3 sm:px-5">
            <div class="flex items-center gap-2">
              <!-- Available badge -->
              <span
                  x-show="doctor.status === 'available'"
                  class="inline-flex items-center justify-center gap-1 rounded-full bg-success-500 px-2.5 py-0.5 text-xs font-medium text-white"
              >
                  Available
              </span>

              <!-- Full / error badge -->
              <span
                  x-show="doctor.status !== 'available'"
                  class="inline-flex items-center justify-center gap-1 rounded-full bg-error-500 px-2.5 py-0.5 text-xs font-medium text-white"
              >
                  Full
              </span>
          </div>
          </td>
              <td class="px-3 py-3 sm:px-5">
            <div class="flex items-center">
              <!-- <p
                class="rounded-full bg-success-50 px-2 py-0.5 text-theme-xs font-medium text-success-600 dark:bg-success-500/15 dark:text-success-500"
              >
                Accept
              </p> -->
              <button
                  class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white shadow-theme-xs transition hover:bg-brand-600"
                  @click.prevent="selectDoctor(doctor)"
                >
                  Select
              </button>
            </div>
          </td>
        </tr>
        </template>
        <template x-if="$store.matches && $store.matches.length === 0">
          <tr>
            <td colspan="5" class="px-5 py-8 text-center text-gray-500 dark:text-gray-400">
              <div class="mx-auto max-w-sm">
                <p class="text-sm font-medium text-gray-700 dark:text-gray-300">No doctors match your preferences yet.</p>
                <p class="mt-1 text-xs">Try broadening specialty, gender, or preferred time to get more options.</p>
              </div>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
