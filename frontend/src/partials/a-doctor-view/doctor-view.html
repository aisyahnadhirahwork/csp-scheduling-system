<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white px-4 pb-3 pt-4 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6">

  <!-- Header -->
  <div class="flex flex-col gap-2 mb-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
        Doctor Availability
      </h3>
      <p class="text-theme-sm mt-1 text-gray-500 dark:text-gray-400">
        Indicate when the doctor is NOT available so patients can book appointments accordingly.
      </p>
    </div>
  </div>

  <form id="availability-form">
      <!-- Date Picker -->
  <div class="flex flex-col mb-4">
    <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
      Choose the day that doctor is not available<span class="text-error-500">*</span>
    </label>
    <input
      type="date" required
      id="availability-date"
      min=""
      placeholder="Select date"
      class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
      onclick="this.showPicker()"
    />
  </div>

  <!-- Time Pickers (From & To) -->
  <div class="flex flex-col gap-4 mb-4 sm:flex-row sm:gap-5">
    <div class="flex-1">
      <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
        Start Time
      </label>
      <input
      id="start-time"
        type="time" required
        placeholder="09:00 AM"
        onclick="this.showPicker()"
        class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
      />
    </div>
    <div class="flex-1">
      <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
        End Time
      </label>
      <input
      id="end-time"
        type="time"
        placeholder="17:00 PM"
        onclick="this.showPicker()"
        class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
      />
    </div>
  </div>

  <!-- Reason Dropdown -->
  <div class="flex flex-col mb-4">
    <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
      Reason<span class="text-error-500">*</span>
    </label>
    <select
    required
      class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
    >
      <option value="">Select Option</option>
      <option value="unavailable">Unavailable</option>
      <option value="off_duty">Off-duty</option>
    </select>
  </div>

  <!-- Submit Button -->
  <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
    <button
      type="submit"
      class="inline-flex w-full items-center justify-center gap-2 px-4 py-3 text-sm font-medium text-white transition rounded-lg bg-brand-500 shadow-theme-xs hover:bg-brand-600"
    >
      Save Availability
    </button>
  </div>
  </form>
</div>
