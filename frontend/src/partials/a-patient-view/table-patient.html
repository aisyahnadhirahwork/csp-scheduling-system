<div
    class="overflow-hidden rounded-2xl border border-gray-200 bg-white mt-4 px-4 pb-3 pt-4 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6"
    x-data="{
        patient: {
            first_name: localStorage.getItem('first_name') || '',
            last_name: localStorage.getItem('last_name') || '',
            user_type: localStorage.getItem('user_type') || ''
        },
        upcomingAppointments: [],
        loadingUpcoming: true,
        appointmentError: '',
        async init() {
            await this.fetchUpcomingAppointments();
        },
        async fetchUpcomingAppointments() {
            this.loadingUpcoming = true;
            this.appointmentError = '';
            try {
                const res = await fetch('/api/appointments/', { credentials: 'include' });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || 'Failed to load appointments');
                }

                this.upcomingAppointments = (Array.isArray(data) ? data : []).filter((appt) =>
                    (appt.status || '').toLowerCase() === 'upcoming'
                );
            } catch (error) {
                console.error('Failed to fetch appointments:', error);
                this.appointmentError = error.message || 'Could not load appointments';
                this.upcomingAppointments = [];
            } finally {
                this.loadingUpcoming = false;
            }
        },
        formatDate(value) {
            if (!value) return '-';
            const dt = new Date(value);
            if (Number.isNaN(dt.getTime())) return '-';
            return dt.toLocaleDateString([], { dateStyle: 'medium' });
        },
        formatTime(value) {
            if (!value) return '-';
            const dt = new Date(value);
            if (Number.isNaN(dt.getTime())) return '-';
            return dt.toLocaleTimeString([], { timeStyle: 'short' });
        },
        async cancelAppointment(appointmentId) {
            if (!confirm('Are you sure you want to cancel this appointment?')) return;
            try {
                const res = await fetch(`/api/appointments/${appointmentId}/cancel/`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to cancel appointment');
                await this.fetchUpcomingAppointments();
            } catch (error) {
                console.error('Cancel failed:', error);
                alert(error.message || 'Could not cancel the appointment');
            }
        },
        rescheduleApptId: null,
        rescheduleMatches: [],
        rescheduleLoading: false,
        rescheduleError: '',
        async searchReschedule(appointmentId) {
            this.rescheduleApptId = appointmentId;
            this.rescheduleMatches = [];
            this.rescheduleLoading = true;
            this.rescheduleError = '';
            try {
                const res = await fetch(`/api/appointments/${appointmentId}/reschedule/search/`, {
                    credentials: 'include'
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to find reschedule options');
                this.rescheduleMatches = data.matches || [];
                if (this.rescheduleMatches.length === 0) {
                    this.rescheduleError = 'No available slots found for rescheduling.';
                }
            } catch (error) {
                console.error('Reschedule search failed:', error);
                this.rescheduleError = error.message || 'Could not search for reschedule options';
            } finally {
                this.rescheduleLoading = false;
            }
        },
        async confirmReschedule(match) {
            if (!confirm(`Reschedule to Dr. ${match.name} on ${this.formatDate(match.slot.start)} at ${this.formatTime(match.slot.start)}?`)) return;
            try {
                const res = await fetch(`/api/appointments/${this.rescheduleApptId}/reschedule/confirm/`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        doctor_id: match.doctor_id,
                        slot_start: match.slot.start,
                        slot_end: match.slot.end,
                        penalty: match.penalty
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to confirm reschedule');
                this.rescheduleApptId = null;
                this.rescheduleMatches = [];
                await this.fetchUpcomingAppointments();
            } catch (error) {
                console.error('Reschedule confirm failed:', error);
                alert(error.message || 'Could not reschedule the appointment');
            }
        },
        cancelReschedule() {
            this.rescheduleApptId = null;
            this.rescheduleMatches = [];
            this.rescheduleError = '';
        }
    }">
    <!-- Welcome greeting -->
    <div class="mb-6">
        <h2 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
            Hi, welcome <span class="text-brand-500" x-text="patient.first_name"></span> 👋
        </h2>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Here's an overview of your upcoming appointments.</p>
    </div>

    <!-- Upcoming Appointments -->
    <div>
        <div class="mb-3 flex items-center justify-between">
            <h4 class="text-sm font-semibold text-gray-800 dark:text-white/90">Upcoming Appointments</h4>
            <span class="inline-flex items-center gap-1.5 rounded-full border border-brand-200 bg-brand-50 px-2.5 py-0.5 text-[11px] font-semibold text-brand-600 dark:border-brand-500/30 dark:bg-brand-500/10 dark:text-brand-400">
                <span class="inline-block h-1.5 w-1.5 rounded-full bg-brand-500 animate-pulse"></span>
                <span x-text="`${upcomingAppointments.length} Upcoming`"></span>
            </span>
        </div>

        <template x-if="loadingUpcoming">
            <p class="text-sm text-gray-500 dark:text-gray-400 py-4 text-center">Loading appointments...</p>
        </template>

        <template x-if="!loadingUpcoming && appointmentError">
            <p class="text-sm text-error-600 dark:text-error-400 py-4 text-center" x-text="appointmentError"></p>
        </template>

        <template x-if="!loadingUpcoming && !appointmentError && upcomingAppointments.length === 0">
            <p class="text-sm text-gray-500 dark:text-gray-400 py-4 text-center">No upcoming appointments found.</p>
        </template>

        <div class="max-h-[400px] overflow-y-auto space-y-2 pr-1" x-show="!loadingUpcoming && !appointmentError && upcomingAppointments.length > 0" x-cloak>
            <template x-for="appt in upcomingAppointments" :key="appt.appointment_id">
                <div>
                    <!-- Compact appointment row -->
                    <div class="group flex items-center gap-4 rounded-xl border border-gray-100 bg-white px-4 py-3 transition-all hover:border-brand-200 hover:shadow-sm dark:border-gray-800 dark:bg-white/[0.03] dark:hover:border-brand-500/30">
                        <!-- Left accent bar -->
                        <div class="hidden sm:block h-10 w-1 flex-shrink-0 rounded-full bg-brand-500"></div>

                        <!-- Doctor + ID -->
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2">
                                <p class="truncate text-sm font-semibold text-gray-800 dark:text-white/90" x-text="appt.doctor_name || '-'"></p>
                                <span class="flex-shrink-0 rounded bg-gray-100 px-1.5 py-0.5 text-[10px] font-mono text-gray-400 dark:bg-gray-800 dark:text-gray-500" x-text="`#${appt.appointment_id}`"></span>
                            </div>
                            <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">
                                <span x-text="formatDate(appt.slot_start)"></span>
                                <span class="mx-1 text-gray-300 dark:text-gray-600">&middot;</span>
                                <span x-text="`${formatTime(appt.slot_start)} – ${formatTime(appt.slot_end)}`"></span>
                            </p>
                        </div>

                        <!-- Status pill -->
                        <span class="hidden sm:inline-flex flex-shrink-0 items-center gap-1 rounded-full bg-success-50 px-2 py-0.5 text-[11px] font-medium text-success-700 dark:bg-success-500/15 dark:text-success-400">
                            <span class="inline-block h-1 w-1 rounded-full bg-success-500"></span>
                            <span x-text="appt.status"></span>
                        </span>

                        <!-- Actions -->
                        <div class="flex flex-shrink-0 items-center gap-1.5">
                            <button
                                type="button"
                                x-show="appt.reschedule_count < 1"
                                @click="searchReschedule(appt.appointment_id)"
                                :disabled="rescheduleLoading && rescheduleApptId === appt.appointment_id"
                                class="rounded-lg border border-warning-200 bg-warning-50 px-3 py-1.5 text-xs font-medium text-warning-700 transition hover:bg-warning-100 focus:outline-hidden focus:ring-2 focus:ring-warning-500/20 disabled:opacity-50 dark:border-warning-500/30 dark:bg-warning-500/10 dark:text-warning-400 dark:hover:bg-warning-500/20"
                            >
                                <span x-show="!(rescheduleLoading && rescheduleApptId === appt.appointment_id)">Reschedule</span>
                                <span x-show="rescheduleLoading && rescheduleApptId === appt.appointment_id">Searching...</span>
                            </button>
                            <span
                                x-show="appt.reschedule_count >= 1"
                                class="text-[11px] text-gray-400 dark:text-gray-500 italic"
                            >Rescheduled</span>
                            <button
                                type="button"
                                @click="cancelAppointment(appt.appointment_id)"
                                class="rounded-lg border border-error-200 bg-error-50 px-3 py-1.5 text-xs font-medium text-error-700 transition hover:bg-error-100 focus:outline-hidden focus:ring-2 focus:ring-error-500/20 dark:border-error-500/30 dark:bg-error-500/10 dark:text-error-400 dark:hover:bg-error-500/20"
                            >
                                Cancel
                            </button>
                        </div>
                    </div>

                    <!-- Reschedule results panel (slides under the row) -->
                    <template x-if="rescheduleApptId === appt.appointment_id && !rescheduleLoading">
                        <div class="ml-4 sm:ml-9 mt-1 mb-1 rounded-lg border border-warning-200 bg-warning-50/50 p-3 dark:border-warning-500/20 dark:bg-warning-500/5">
                            <div class="mb-2 flex items-center justify-between">
                                <h5 class="text-xs font-semibold text-gray-700 dark:text-white/80">Available Slots</h5>
                                <button type="button" @click="cancelReschedule()" class="text-[11px] text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300">&times; Close</button>
                            </div>

                            <template x-if="rescheduleError">
                                <p class="text-xs text-error-600 dark:text-error-400" x-text="rescheduleError"></p>
                            </template>

                            <template x-if="!rescheduleError && rescheduleMatches.length > 0">
                                <div class="space-y-1.5">
                                    <template x-for="(match, idx) in rescheduleMatches" :key="idx">
                                        <div class="flex items-center justify-between rounded-lg bg-white px-3 py-2 dark:bg-gray-900/40">
                                            <div class="min-w-0">
                                                <span class="text-xs font-medium text-gray-800 dark:text-white/90" x-text="`Dr. ${match.name}`"></span>
                                                <span class="mx-1 text-gray-300 dark:text-gray-600">&middot;</span>
                                                <span class="text-xs text-gray-500 dark:text-gray-400" x-text="`${match.specialty}`"></span>
                                                <span class="mx-1 text-gray-300 dark:text-gray-600">&middot;</span>
                                                <span class="text-xs text-gray-500 dark:text-gray-400" x-text="`${formatDate(match.slot.start)} ${formatTime(match.slot.start)}-${formatTime(match.slot.end)}`"></span>
                                                <span class="ml-1 text-[10px] text-gray-400 dark:text-gray-500" x-text="`(penalty: ${match.penalty})`"></span>
                                            </div>
                                            <button
                                                type="button"
                                                @click="confirmReschedule(match)"
                                                class="ml-3 flex-shrink-0 rounded-md bg-brand-500 px-2.5 py-1 text-[11px] font-medium text-white transition hover:bg-brand-600"
                                            >
                                                Confirm
                                            </button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
</div>
