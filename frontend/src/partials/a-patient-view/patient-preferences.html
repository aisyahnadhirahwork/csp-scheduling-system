<div
    class="overflow-hidden rounded-2xl border border-gray-200 bg-white px-4 pb-3 pt-4 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6">
    <div
        class="flex flex-col gap-2 mb-4 sm:flex-row sm:items-center sm:justify-between"
        >
        <div>
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
                Patient Preferences
            </h3>
            <p class="text-theme-sm mt-1 text-gray-500 dark:text-gray-400">
                Specify your preferences to get better scheduling results.
            </p>
        </div>
    </div>
    <form id="patient-preferences-form" class="space-y-5 pb-2">
      <div class="rounded-xl border border-gray-100 bg-gray-50/60 p-4 dark:border-gray-800 dark:bg-white/[0.02]">
        <h4 class="mb-1 text-sm font-semibold text-gray-800 dark:text-white/90">Doctor Preference</h4>
        <p class="mb-4 text-xs text-gray-500 dark:text-gray-400">Choose who you want to consult with.</p>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
              Specialty<span class="text-error-500">*</span>
            </label>
            <div x-data="{ isOptionSelected: false }" class="relative z-20 bg-transparent">
              <select
                class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-white px-4 py-2.5 pr-11 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                :class="isOptionSelected && 'text-gray-800 dark:text-white/90'"
                @change="isOptionSelected = true"
                name="preferred_specialty"
              >
                <option value="" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Select Option</option>
                <option value="General" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">General</option>
                <option value="Cardiology" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Cardiology</option>
                <option value="Neurology" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Neurology</option>
                <option value="Pediatrics" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Pediatrics</option>
              </select>
              <span class="pointer-events-none absolute top-1/2 right-4 z-30 -translate-y-1/2 text-gray-500 dark:text-gray-400">
                <svg class="stroke-current" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396" stroke="" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
            </div>
            <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">If no specialty is selected, a General Doctor will be assigned automatically.</p>
          </div>

          <div>
            <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
              Doctor's Gender<span class="text-gray-500"> (optional)</span>
            </label>
            <div x-data="{ isOptionSelected: false }" class="relative z-20 bg-transparent">
              <select
                class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-white px-4 py-2.5 pr-11 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                :class="isOptionSelected && 'text-gray-800 dark:text-white/90'"
                @change="isOptionSelected = true"
                name="preferred_gender"
              >
                <option value="" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Select Option</option>
                <option value="M" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Male</option>
                <option value="F" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">Female</option>
              </select>
              <span class="pointer-events-none absolute top-1/2 right-4 z-30 -translate-y-1/2 text-gray-500 dark:text-gray-400">
                <svg class="stroke-current" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396" stroke="" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
            </div>
          </div>
        </div>
      </div>

      <div class="rounded-xl border border-gray-100 bg-gray-50/60 p-4 dark:border-gray-800 dark:bg-white/[0.02]">
        <h4 class="mb-1 text-sm font-semibold text-gray-800 dark:text-white/90">Time & Session</h4>
        <p class="mb-4 text-xs text-gray-500 dark:text-gray-400">Pick your preferred consultation window.</p>

        <div x-data="{ selected: '' }" class="grid grid-cols-1 gap-3 sm:grid-cols-3">
          <label
            class="cursor-pointer rounded-xl border border-gray-300 bg-white p-3 transition hover:border-brand-500 dark:border-gray-700 dark:bg-gray-900/40"
            :class="selected === 'MORNING' && 'border-brand-500 bg-brand-50 dark:bg-white/[0.07]'"
          >
            <input type="radio" name="preferred_time_range" value="MORNING" class="sr-only" x-model="selected" @change="selected = 'MORNING'" />
            <div class="flex items-start gap-3">
              <span class="mt-0.5 flex h-5 w-5 items-center justify-center rounded-full border border-gray-300" :class="selected === 'MORNING' && 'border-brand-500 bg-brand-500'">
                <span class="h-2.5 w-2.5 rounded-full bg-white" x-show="selected === 'MORNING'"></span>
              </span>
              <div>
                <p class="text-sm font-medium text-gray-800 dark:text-white/90">Morning</p>
                <p class="text-xs text-gray-500 dark:text-gray-400">9:00 AM - 11:00 AM</p>
              </div>
            </div>
          </label>

          <label
            class="cursor-pointer rounded-xl border border-gray-300 bg-white p-3 transition hover:border-brand-500 dark:border-gray-700 dark:bg-gray-900/40"
            :class="selected === 'MIDDAY' && 'border-brand-500 bg-brand-50 dark:bg-white/[0.07]'"
          >
            <input type="radio" name="preferred_time_range" value="MIDDAY" class="sr-only" x-model="selected" @change="selected = 'MIDDAY'" />
            <div class="flex items-start gap-3">
              <span class="mt-0.5 flex h-5 w-5 items-center justify-center rounded-full border border-gray-300" :class="selected === 'MIDDAY' && 'border-brand-500 bg-brand-500'">
                <span class="h-2.5 w-2.5 rounded-full bg-white" x-show="selected === 'MIDDAY'"></span>
              </span>
              <div>
                <p class="text-sm font-medium text-gray-800 dark:text-white/90">Midday</p>
                <p class="text-xs text-gray-500 dark:text-gray-400">11:00 AM - 1:00 PM</p>
              </div>
            </div>
          </label>

          <label
            class="cursor-pointer rounded-xl border border-gray-300 bg-white p-3 transition hover:border-brand-500 dark:border-gray-700 dark:bg-gray-900/40"
            :class="selected === 'AFTERNOON' && 'border-brand-500 bg-brand-50 dark:bg-white/[0.07]'"
          >
            <input type="radio" name="preferred_time_range" value="AFTERNOON" class="sr-only" x-model="selected" @change="selected = 'AFTERNOON'" />
            <div class="flex items-start gap-3">
              <span class="mt-0.5 flex h-5 w-5 items-center justify-center rounded-full border border-gray-300" :class="selected === 'AFTERNOON' && 'border-brand-500 bg-brand-500'">
                <span class="h-2.5 w-2.5 rounded-full bg-white" x-show="selected === 'AFTERNOON'"></span>
              </span>
              <div>
                <p class="text-sm font-medium text-gray-800 dark:text-white/90">Afternoon</p>
                <p class="text-xs text-gray-500 dark:text-gray-400">2:00 PM - 5:00 PM</p>
              </div>
            </div>
          </label>
        </div>

        <div class="mt-5">
          <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Session duration</label>
          <div class="flex flex-wrap items-center gap-3">
            <label class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 hover:border-brand-500 dark:border-gray-700 dark:bg-gray-900/40 dark:text-gray-300">
              <input type="radio" name="session_length" value="60" class="form-radio" checked>
              <span>60 minutes</span>
            </label>
            <label class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 hover:border-brand-500 dark:border-gray-700 dark:bg-gray-900/40 dark:text-gray-300">
              <input type="radio" name="session_length" value="30" class="form-radio">
              <span>30 minutes</span>
            </label>
          </div>
        </div>
      </div>

      <div class="rounded-xl border border-gray-100 bg-gray-50/60 p-4 dark:border-gray-800 dark:bg-white/[0.02]">
        <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-400">Preferred Date</label>
        <div class="max-w-xs">
          <input
            type="date"
            id="request_date"
            name="request_date"
            class="h-11 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
            onclick="this.showPicker()"
          />
        </div>
      </div>

      <div class="pt-1">
        <button
          type="submit"
          class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-brand-500 px-4 py-3 text-sm font-medium text-white shadow-theme-xs transition hover:bg-brand-600"
        >
          Find Doctors
          <svg class="fill-current" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M9.77692 3.24224C9.91768 3.17186 10.0834 3.17186 10.2241 3.24224L15.3713 5.81573L10.3359 8.33331C10.1248 8.43888 9.87626 8.43888 9.66512 8.33331L4.6298 5.81573L9.77692 3.24224ZM3.70264 7.0292V13.4124C3.70264 13.6018 3.80964 13.775 3.97903 13.8597L9.25016 16.4952L9.25016 9.7837C9.16327 9.75296 9.07782 9.71671 8.99432 9.67496L3.70264 7.0292ZM10.7502 16.4955V9.78396C10.8373 9.75316 10.923 9.71683 11.0067 9.67496L16.2984 7.0292V13.4124C16.2984 13.6018 16.1914 13.775 16.022 13.8597L10.7502 16.4955ZM9.41463 17.4831L9.10612 18.1002C9.66916 18.3817 10.3319 18.3817 10.8949 18.1002L16.6928 15.2013C17.3704 14.8625 17.7984 14.17 17.7984 13.4124V6.58831C17.7984 5.83076 17.3704 5.13823 16.6928 4.79945L10.8949 1.90059C10.3319 1.61908 9.66916 1.61907 9.10612 1.90059L9.44152 2.57141L9.10612 1.90059L3.30823 4.79945C2.63065 5.13823 2.20264 5.83076 2.20264 6.58831V13.4124C2.20264 14.17 2.63065 14.8625 3.30823 15.2013L9.10612 18.1002L9.41463 17.4831Z"
              fill=""
            />
          </svg>
        </button>
      </div>
    </form>
</div>
<script>
  const today = new Date().toISOString().split("T")[0];
  document.getElementById("request_date").setAttribute("min", today);
</script>
