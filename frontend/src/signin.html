<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Sign In</title>

  <!-- Spinner style -->
  <style>
    :root {
      --bg-a: #e7f1ff;
      --bg-b: #dff7ef;
      --bg-c: #f8fbff;
      --card-border: rgba(255, 255, 255, 0.45);
      --card-shadow: 0 20px 50px rgba(19, 42, 79, 0.16);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ink: #0f172a;
      --muted: #5f6b7f;
      --particle: rgba(37, 99, 235, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Poppins", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.2), transparent 35%),
        radial-gradient(circle at 82% 18%, rgba(16, 185, 129, 0.16), transparent 35%),
        linear-gradient(140deg, var(--bg-a), var(--bg-b) 52%, var(--bg-c));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .particle-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.9), var(--particle));
      opacity: 0.35;
      filter: blur(0.2px);
      animation: drift var(--dur) linear infinite;
      animation-delay: var(--delay);
      left: var(--x);
      top: var(--y);
    }

    @keyframes drift {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      25% {
        transform: translate3d(16px, -26px, 0) scale(1.03);
      }
      50% {
        transform: translate3d(-20px, -54px, 0) scale(0.96);
      }
      75% {
        transform: translate3d(13px, -30px, 0) scale(1.04);
      }
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .login-wrap {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 28px;
      position: relative;
      z-index: 1;
    }

    .login-title {
      margin: 0 0 6px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .login-subtitle {
      margin: 0 0 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1f2a3d;
    }

    .input {
      width: 100%;
      border: 1px solid #d6deea;
      background: rgba(255, 255, 255, 0.95);
      padding: 11px 12px;
      border-radius: 10px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
      font-size: 0.95rem;
    }

    .input:focus {
      border-color: rgba(37, 99, 235, 0.65);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .btn-primary {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      padding: 11px 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
      margin-top: 2px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .signup-copy {
      margin: 18px 0 0;
      font-size: 0.9rem;
      color: #344054;
      text-align: center;
    }

    .signup-copy a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .signup-copy a:hover {
      text-decoration: underline;
    }

    #spinner {
      display: none;
      width: 30px;
      height: 30px;
      border: 4px solid rgba(0,0,0,0.1);
      border-left-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 15px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #error-msg {
      color: #dc2626;
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    @media (max-width: 520px) {
      .login-wrap {
        padding: 22px;
        border-radius: 16px;
      }
      .login-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <div id="particleLayer" class="particle-layer" aria-hidden="true"></div>

  <div class="login-wrap">
    <h1 class="login-title">Sign In</h1>
    <p class="login-subtitle">Manage your doctor appointments with ease</p>

    <form id="signinForm">
      <!-- Email -->
      <div class="mb-4">
        <label>Email</label>
        <input
          type="email"
          id="email"
          required
          class="input"
          placeholder="test@test.com"
        />
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label>Password</label>
        <input
          type="password"
          id="password"
          required
          class="input"
          placeholder="••••••••"
        />
      </div>

      <!-- Button -->
      <button
        type="button"
        id="loginBtn"
        class="btn-primary"
      >
        Sign In
      </button>

      <div>
        <p class="signup-copy">
          Belum ada akaun?
          <a
            href="/signup.html"
            class=""
            >Sign Up</a
          >
        </p>
      </div>

      <!-- Spinner + Error -->
      <div id="spinner"></div>
      <div id="error-msg"></div>
    </form>
  </div>

  <!-- LOGIN SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const layer = document.getElementById("particleLayer");
      if (layer) {
        const count = 28;
        for (let i = 0; i < count; i += 1) {
          const p = document.createElement("span");
          p.className = "particle";
          const size = 3 + Math.random() * 7;
          const duration = 18 + Math.random() * 24;
          const delay = -(Math.random() * duration);
          p.style.setProperty("--size", `${size}px`);
          p.style.setProperty("--dur", `${duration}s`);
          p.style.setProperty("--delay", `${delay}s`);
          p.style.setProperty("--x", `${Math.random() * 100}%`);
          p.style.setProperty("--y", `${Math.random() * 100}%`);
          layer.appendChild(p);
        }
      }

      const form = document.getElementById("signinForm");
      const loginBtn = document.getElementById("loginBtn");
      const spinner = document.getElementById("spinner");
      const errorMsg = document.getElementById("error-msg");

      if (!form || !loginBtn) return;

      form.addEventListener("submit", e => e.preventDefault());

      loginBtn.addEventListener("click", async () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        spinner.style.display = "block";
        errorMsg.textContent = "";

        try {
          const response = await fetch("http://localhost:8000/api/login/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();
          spinner.style.display = "none";

          if (data.success) {
            localStorage.setItem("user_type", data.user_type);
            localStorage.setItem("first_name", data.first_name);
            localStorage.setItem("last_name", data.last_name);
            localStorage.setItem("user_id", data.user_id);
            localStorage.setItem("email", data.email);
            window.location.href = "/index.html";
          } else {
            errorMsg.textContent = data.error || "Login failed";
          }
        } catch (err) {
          spinner.style.display = "none";
          errorMsg.textContent = "Server error. Check backend.";
          console.error(err);
        }
      });
    });
  </script>

</body>
</html>
