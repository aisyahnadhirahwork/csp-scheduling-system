<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentication</title>
  <style>
    :root {
      --bg-a: #e7f1ff;
      --bg-b: #dff7ef;
      --bg-c: #f8fbff;
      --card-border: rgba(255, 255, 255, 0.45);
      --card-shadow: 0 20px 50px rgba(19, 42, 79, 0.16);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ink: #0f172a;
      --muted: #5f6b7f;
      --particle: rgba(37, 99, 235, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.2), transparent 35%),
        radial-gradient(circle at 82% 18%, rgba(16, 185, 129, 0.16), transparent 35%),
        linear-gradient(140deg, var(--bg-a), var(--bg-b) 52%, var(--bg-c));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 24px;
    }

    /* ── Particles ── */
    .particle-layer {
      position: fixed; inset: 0;
      overflow: hidden; pointer-events: none; z-index: 0;
    }
    .particle {
      position: absolute;
      width: var(--size); height: var(--size);
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), var(--particle));
      opacity: 0.35;
      filter: blur(0.2px);
      animation: drift var(--dur) linear infinite;
      animation-delay: var(--delay);
      left: var(--x); top: var(--y);
    }
    @keyframes drift {
      0%   { transform: translate3d(0,0,0) scale(1); }
      25%  { transform: translate3d(16px,-26px,0) scale(1.03); }
      50%  { transform: translate3d(-20px,-54px,0) scale(0.96); }
      75%  { transform: translate3d(13px,-30px,0) scale(1.04); }
      100% { transform: translate3d(0,0,0) scale(1); }
    }

    /* ── Card ── */
    .auth-card {
      width: 100%; max-width: 480px;
      background: rgba(255,255,255,0.82);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 36px 32px 32px;
      position: relative; z-index: 1;
      transition: max-width 0.4s ease;
    }
    .auth-card.expanded { max-width: 560px; }

    /* ── Tab Toggle ── */
    .tab-bar {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: all 0.25s ease;
    }
    .tab-btn.active {
      background: #fff;
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(37,99,235,0.12);
    }
    .tab-btn:hover:not(.active) { color: var(--ink); }

    /* ── Form panels ── */
    .panel { display: none; animation: fadeUp 0.35s ease; }
    .panel.active { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Headings ── */
    .form-title {
      font-size: 1.6rem; font-weight: 700;
      text-align: center; margin-bottom: 4px;
    }
    .form-subtitle {
      text-align: center; color: var(--muted);
      font-size: 0.88rem; margin-bottom: 24px;
    }

    /* ── Inputs ── */
    label {
      display: block; margin-bottom: 6px;
      font-size: 0.85rem; font-weight: 600; color: #1f2a3d;
    }
    .field { margin-bottom: 18px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .input-wrap { position: relative; }
    .input-wrap svg {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      width: 17px; height: 17px; color: #9ca3af; pointer-events: none;
    }
    .input {
      width: 100%;
      border: 1px solid #d6deea;
      background: rgba(255,255,255,0.95);
      padding: 11px 12px 11px 40px;
      border-radius: 10px;
      outline: none;
      font-size: 0.92rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-plain { padding-left: 12px; }
    .input:focus {
      border-color: rgba(37,99,235,0.65);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .input::placeholder { color: #9ca3af; }
    select.input { appearance: none; cursor: pointer; }

    /* ── Password visibility ── */
    .pw-toggle {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 1rem; line-height: 1;
      color: #9ca3af;
    }
    .pw-toggle:hover { color: #6b7280; }

    /* ── Password strength ── */
    .strength-track { height: 4px; background: #e5e7eb; border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .strength-fill { height: 100%; width: 0%; transition: width 0.3s, background-color 0.3s; border-radius: 4px; }
    .s-weak { width: 33%; background: #ef4444; }
    .s-fair { width: 66%; background: #eab308; }
    .s-good { width: 100%; background: #22c55e; }

    /* ── Doctor section ── */
    .doctor-section {
      padding: 16px; border-radius: 12px;
      background: linear-gradient(135deg, #f3f4f6 0%, #fff 100%);
      border: 1px solid #e5e7eb;
      margin-bottom: 18px;
    }
    .doctor-section-title {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--muted); margin-bottom: 14px;
    }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%; border: none; border-radius: 12px;
      background: var(--accent); color: #fff;
      font-weight: 600; font-size: 0.95rem;
      padding: 12px 16px; cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37,99,235,0.25);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.55; cursor: not-allowed; transform: none;
    }

    /* ── Terms checkbox ── */
    .terms-row {
      display: flex; align-items: flex-start;
      gap: 10px; margin-bottom: 20px; font-size: 0.84rem;
    }
    .terms-row input[type="checkbox"] {
      width: 18px; height: 18px; margin-top: 2px;
      accent-color: var(--accent); cursor: pointer; flex-shrink: 0;
    }
    .terms-row a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .terms-row a:hover { text-decoration: underline; }

    /* ── Spinner / Error ── */
    .spinner {
      display: none; width: 28px; height: 28px;
      border: 3px solid rgba(0,0,0,0.08);
      border-left-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 14px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      color: #dc2626; text-align: center;
      margin-top: 10px; font-size: 0.85rem;
      min-height: 20px;
    }

    /* ── Switch link ── */
    .switch-text {
      text-align: center; margin-top: 20px;
      padding-top: 18px; border-top: 1px solid #e5e7eb;
      font-size: 0.88rem; color: #344054;
    }
    .switch-link {
      color: var(--accent); font-weight: 600;
      text-decoration: none; cursor: pointer;
    }
    .switch-link:hover { text-decoration: underline; }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      body { padding: 14px; }
      .auth-card { padding: 24px 20px 20px; border-radius: 18px; }
      .field-row { grid-template-columns: 1fr; }
      .form-title { font-size: 1.35rem; }
    }
  </style>
</head>

<body
  x-data="{
    activeTab: 'signin',
    userType: '',
    showDoctorFields: false,
    showPw: false,
    showSignupPw: false,
    pwStrength: 0
  }"
>

  <div id="particleLayer" class="particle-layer" aria-hidden="true"></div>

  <div class="auth-card" :class="activeTab === 'signup' ? 'expanded' : ''">

    <!-- Tab Bar -->
    <div class="tab-bar">
      <button
        class="tab-btn"
        :class="activeTab === 'signin' ? 'active' : ''"
        @click="activeTab = 'signin'"
        type="button"
      >Sign In</button>
      <button
        class="tab-btn"
        :class="activeTab === 'signup' ? 'active' : ''"
        @click="activeTab = 'signup'"
        type="button"
      >Sign Up</button>
    </div>

    <!-- ═══════════════════════ SIGN IN PANEL ═══════════════════════ -->
    <div class="panel" :class="activeTab === 'signin' ? 'active' : ''">
      <h1 class="form-title">Welcome Back</h1>
      <p class="form-subtitle">Manage your doctor appointments with ease</p>

      <form id="signinForm">
        <div class="field">
          <label for="signin-email">Email</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input type="email" id="signin-email" required class="input" placeholder="you@example.com" />
          </div>
        </div>

        <div class="field">
          <label for="signin-password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input :type="showPw ? 'text' : 'password'" id="signin-password" required class="input" placeholder="Enter your password" style="padding-right:42px" />
            <button type="button" class="pw-toggle" @click="showPw = !showPw">
              <span x-show="!showPw">&#128065;</span>
              <span x-show="showPw">&#128064;</span>
            </button>
          </div>
        </div>

        <button type="button" id="loginBtn" class="btn-primary">Sign In</button>
        <div id="signin-spinner" class="spinner"></div>
        <div id="signin-error" class="error-msg"></div>
      </form>

      <p class="switch-text">
        Don't have an account?
        <a class="switch-link" @click.prevent="activeTab = 'signup'">Sign Up</a>
      </p>
    </div>

    <!-- ═══════════════════════ SIGN UP PANEL ═══════════════════════ -->
    <div class="panel" :class="activeTab === 'signup' ? 'active' : ''">
      <h1 class="form-title">Create Account</h1>
      <p class="form-subtitle">Join our healthcare scheduling platform</p>

      <form id="signupForm">
        <!-- Name row -->
        <div class="field field-row">
          <div>
            <label for="signup-first-name">First Name</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input name="first_name" id="signup-first-name" required placeholder="John" class="input" />
            </div>
          </div>
          <div>
            <label for="signup-last-name">Last Name</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input name="last_name" id="signup-last-name" required placeholder="Doe" class="input" />
            </div>
          </div>
        </div>

        <!-- User Type -->
        <div class="field">
          <label for="signup-user-type">Role</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <select
              name="user_type"
              id="signup-user-type"
              required
              x-model="userType"
              @change="showDoctorFields = userType === 'doctor'"
              class="input"
            >
              <option value="">Select your role</option>
              <option value="patient">Patient</option>
              <option value="doctor">Doctor</option>
            </select>
          </div>
        </div>

        <!-- Doctor-only fields -->
        <template x-if="showDoctorFields">
          <div class="doctor-section">
            <p class="doctor-section-title">Professional Information</p>
            <div class="field field-row">
              <div>
                <label for="signup-gender">Gender</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="5"></circle>
                    <path d="M20 21a8 8 0 0 0-16 0"></path>
                  </svg>
                  <select name="gender" id="signup-gender" class="input">
                    <option value="">Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                  </select>
                </div>
              </div>
              <div>
                <label for="signup-specialisation">Specialisation</label>
                <div class="input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                  </svg>
                  <select name="specialisation" id="signup-specialisation" class="input">
                    <option value="">Select specialisation</option>
                    <option value="general">General Doctor</option>
                    <option value="cardiology">Cardiology</option>
                    <option value="pediatrics">Pediatrics</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- Email -->
        <div class="field">
          <label for="signup-email">Email Address</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <input type="email" name="email" id="signup-email" required placeholder="you@example.com" class="input" />
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="signup-password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              :type="showSignupPw ? 'text' : 'password'"
              name="password"
              id="signup-password"
              required
              placeholder="Minimum 8 characters"
              class="input"
              style="padding-right:42px"
              @input="
                let v = $el.value;
                pwStrength = v.length > 0
                  ? ((/[a-z]/.test(v)?1:0) + (/[A-Z]/.test(v)?1:0) + (/[0-9]/.test(v)?1:0) + (/[^a-zA-Z0-9]/.test(v)?1:0)) * 25
                  : 0
              "
            />
            <button type="button" class="pw-toggle" @click="showSignupPw = !showSignupPw">
              <span x-show="!showSignupPw">&#128065;</span>
              <span x-show="showSignupPw">&#128064;</span>
            </button>
          </div>
          <div class="strength-track">
            <div
              class="strength-fill"
              :class="pwStrength <= 33 ? 's-weak' : pwStrength <= 66 ? 's-fair' : 's-good'"
              :style="'width:' + pwStrength + '%'"
            ></div>
          </div>
          <p style="font-size:0.75rem;color:#6b7280;margin-top:6px;">
            Use uppercase, lowercase, numbers and symbols
          </p>
        </div>

        <!-- Terms -->
        <div class="terms-row">
          <input type="checkbox" required id="signup-terms" />
          <span>
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
          </span>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary" id="signupBtn">
          <span id="signupText">Create Account</span>
          <span id="signupSpinner" style="display:none">Creating...</span>
        </button>
        <div id="signup-error" class="error-msg"></div>
      </form>

      <p class="switch-text">
        Already have an account?
        <a class="switch-link" @click.prevent="activeTab = 'signin'">Sign In</a>
      </p>
    </div>

  </div>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- SweetAlert2 for signup success -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // ── Particles ──
      const layer = document.getElementById("particleLayer");
      if (layer) {
        for (let i = 0; i < 28; i++) {
          const p = document.createElement("span");
          p.className = "particle";
          const size = 3 + Math.random() * 7;
          const dur = 18 + Math.random() * 24;
          p.style.setProperty("--size", size + "px");
          p.style.setProperty("--dur", dur + "s");
          p.style.setProperty("--delay", -(Math.random() * dur) + "s");
          p.style.setProperty("--x", Math.random() * 100 + "%");
          p.style.setProperty("--y", Math.random() * 100 + "%");
          layer.appendChild(p);
        }
      }

      // ── SIGN IN ──
      const signinForm = document.getElementById("signinForm");
      const loginBtn   = document.getElementById("loginBtn");
      const siSpinner  = document.getElementById("signin-spinner");
      const siError    = document.getElementById("signin-error");

      if (signinForm && loginBtn) {
        signinForm.addEventListener("submit", e => e.preventDefault());

        loginBtn.addEventListener("click", async () => {
          const email    = document.getElementById("signin-email").value;
          const password = document.getElementById("signin-password").value;

          siSpinner.style.display = "block";
          siError.textContent = "";

          try {
            const response = await fetch("/api/login/", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ email, password }),
            });

            const data = await response.json();
            siSpinner.style.display = "none";

            if (response.ok && data.success) {
              localStorage.setItem("user_type", data.user_type);
              localStorage.setItem("first_name", data.first_name);
              localStorage.setItem("last_name", data.last_name);
              localStorage.setItem("user_id", data.user_id);
              localStorage.setItem("email", data.email);
              localStorage.setItem("specialty", data.specialty || "");
              window.location.href = "/index.html";
            } else {
              siError.textContent = data.error || "Login failed";
            }
          } catch (err) {
            siSpinner.style.display = "none";
            siError.textContent = "Server error. Check backend.";
            console.error(err);
          }
        });
      }

      // ── SIGN UP ──
      const signupForm = document.getElementById("signupForm");

      if (signupForm) {
        signupForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const f = e.target;
          const btn         = document.getElementById("signupBtn");
          const submitText  = document.getElementById("signupText");
          const submitSpin  = document.getElementById("signupSpinner");

          btn.disabled = true;
          submitText.style.display = "none";
          submitSpin.style.display = "inline";

          const payload = {
            first_name:     f.first_name.value,
            last_name:      f.last_name.value,
            email:          f.email.value,
            password:       f.password.value,
            user_type:      f.user_type.value,
            gender:         f.gender ? f.gender.value : null,
            specialisation: f.specialisation ? f.specialisation.value : null,
          };

          try {
            const res = await fetch("/api/register/", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            const data = await res.json();

            if (res.ok) {
              Swal.fire("Success", "Account created successfully!", "success")
                .then(() => {
                  // Switch to sign-in tab
                  document.querySelector("[x-data]").__x.$data.activeTab = "signin";
                });
            } else {
              Swal.fire("Error", data.error || "Registration failed", "error");
            }
          } catch {
            Swal.fire("Error", "Server not reachable", "error");
          }

          btn.disabled = false;
          submitText.style.display = "inline";
          submitSpin.style.display = "none";
        });
      }
    });
  </script>

</body>
</html>
